services:
  xsdviewer:
    build: .
    image: online-xsd-viewer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      # ALLOWED_SCHEMA_HOSTS unset → any public http(s) host permitted
      # (private-IP/SSRF guards still active). To lock the deployment down
      # to a specific allowlist, set the variable to a comma-separated
      # list of host regexes, e.g.:
      #   ALLOWED_SCHEMA_HOSTS: '^raw\.githubusercontent\.com$,^github\.com$'
      LOG_LEVEL: INFO
      MAX_UPLOAD_MB: "50"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;r=urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=3);sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
