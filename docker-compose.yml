services:
  xsdviewer:
    build: .
    image: online-xsd-viewer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Uncomment and adjust to allow URL-based XSD fetching.
      # ALLOWED_SCHEMA_HOSTS: '^https://schemas\.example\.com/'
      LOG_LEVEL: INFO
      MAX_UPLOAD_MB: "50"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;r=urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=3);sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
