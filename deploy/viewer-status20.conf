# HTTPS redirect for viewer.status20.net.
# The HTTPS vhost lives in viewer-status20-le-ssl.conf (managed by certbot).

<VirtualHost *:80>
    ServerName viewer.status20.net

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =viewer.status20.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/viewer-status20-error.log
    CustomLog ${APACHE_LOG_DIR}/viewer-status20-access.log combined
</VirtualHost>
