<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName viewer.status20.net

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8180/
    ProxyPassReverse / http://127.0.0.1:8180/

    # Tell the backend the original scheme/port so uvicorn's --proxy-headers
    # produces correct request URLs and the rate-limiter sees the real client IP.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # File uploads (XSD / ZIP). Keep above MAX_UPLOAD_MB on the backend.
    LimitRequestBody 104857600

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Content-Security-Policy "frame-ancestors 'none'"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/viewer-status20-error.log
    CustomLog ${APACHE_LOG_DIR}/viewer-status20-access.log combined

SSLCertificateFile /etc/letsencrypt/live/viewer.status20.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/viewer.status20.net/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
