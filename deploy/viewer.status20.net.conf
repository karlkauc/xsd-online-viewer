# HTTP-only vhost for viewer.status20.net — initial install before Let's Encrypt.
#
# After you run `sudo certbot --apache -d viewer.status20.net`, certbot
# extends this file with a <VirtualHost *:443> block using the obtained
# certificate, and adds an HTTPS-redirect to this :80 block. No manual SSL
# config is needed.
#
# Backend: the online-xsd-viewer Docker container bound to 127.0.0.1:8180.
# See deploy/run-container.sh for the `docker run` command.

<VirtualHost *:80>
    ServerName viewer.status20.net

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8180/
    ProxyPassReverse / http://127.0.0.1:8180/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"

    # File uploads (XSD / ZIP). Keep above MAX_UPLOAD_MB on the backend.
    LimitRequestBody 104857600

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/viewer-status20-error.log
    CustomLog ${APACHE_LOG_DIR}/viewer-status20-access.log combined
</VirtualHost>
