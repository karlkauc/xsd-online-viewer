# Apache vhost for viewer.status20.net.
#
# Reflects the post-`certbot --apache` state: a :80 block that redirects to
# HTTPS, and a :443 block that terminates TLS and proxies to the
# online-xsd-viewer container on 127.0.0.1:8180 (see deploy/run-container.sh).
#
# When you re-run certbot, it may rewrite parts of this file or split the
# :443 block into a separate `*-le-ssl.conf`. Either layout is fine; the
# important parts are: (a) HTTPS-redirect on :80, (b) proxy + security
# headers on :443, (c) X-Forwarded-Proto reflects the actual scheme.

<VirtualHost *:80>
    ServerName viewer.status20.net

    # Force HTTPS — no plaintext app traffic.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/viewer-status20-error.log
    CustomLog ${APACHE_LOG_DIR}/viewer-status20-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName viewer.status20.net

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/viewer.status20.net/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/viewer.status20.net/privkey.pem
    Include                 /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8180/
    ProxyPassReverse / http://127.0.0.1:8180/

    # Tell the backend the original scheme/port so uvicorn's --proxy-headers
    # produces correct request URLs and the rate-limiter sees the real client IP.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # File uploads (XSD / ZIP). Keep above MAX_UPLOAD_MB on the backend.
    LimitRequestBody 104857600

    <IfModule mod_headers.c>
        # HSTS — opt browsers into HTTPS-only for one year. `preload` is
        # commented out until you submit the domain to hstspreload.org.
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Content-Security-Policy "frame-ancestors 'none'"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/viewer-status20-error.log
    CustomLog ${APACHE_LOG_DIR}/viewer-status20-access.log combined
</VirtualHost>

# Server-wide hardening (typically lives in /etc/apache2/conf-available/security.conf):
#   ServerTokens Prod
#   ServerSignature Off
# These are NOT vhost-scoped; verify they are set globally.
